services:
  postgres:
    image: postgres:16
    container_name: project-manager-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: project_manager
      POSTGRES_USER: project_manager_user
      POSTGRES_PASSWORD: project_manager_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  members-api:
    # members-api é uma API externa mockada e não depende do PostgreSQL.
    # Como não há Dockerfile no repositório, subimos via Maven dentro do container.
    image: maven:3.9.9-eclipse-temurin-21
    container_name: project-members-api
    working_dir: /app/members-api
    volumes:
      - ./members-api:/app/members-api
      - maven_repo:/root/.m2
    ports:
      - "8081:8081"
    command: mvn -q -DskipTests spring-boot:run
    restart: unless-stopped

volumes:
  postgres_data:
  maven_repo:

